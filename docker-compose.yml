version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  easytolet.gateway:
    build:
      context: ./src/EasyToLet.Gateway
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ExceptionLogging__Database__Server=host.docker.internal
      - ExceptionLogging__Database__Password=${GATEWAY_LOG_DB_PASSWORD:?Set GATEWAY_LOG_DB_PASSWORD}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    depends_on:
      - rabbitmq

  easytolet.identityservice:
    build:
      context: ./src/EasyToLet.IdentityService
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_URLS=http://+:80
      - Database__Server=host.docker.internal
      - Database__Password=${IDENTITYSERVICE_DB_PASSWORD:?Set IDENTITYSERVICE_DB_PASSWORD}
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Username=guest
      - RabbitMq__Password=guest
    depends_on:
      - rabbitmq

  easytolet.userservice:
